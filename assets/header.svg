<svg xmlns="http://www.w3.org/2000/svg" width="880" height="200" viewBox="0 0 880 200" fill="none">
  <defs>
    <linearGradient id="accent" x1="0" y1="0" x2="880" y2="0">
      <stop stop-color="#635BFF"/>
      <stop offset="1" stop-color="#635BFF" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- 干净的深色底，纯色不加乱七八糟的光球 -->
  <rect width="880" height="200" fill="#0d1117"/>

  <!-- 顶部一条 Stripe 紫渐变细线，唯一的装饰 -->
  <rect width="880" height="3" fill="url(#accent)"/>

  <!-- 左上 kicker：字间距大、小号、紫色 -->
  <text x="56" y="56" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" letter-spacing="4" fill="#635BFF">PROFILE</text>

  <!-- 主名字：大号、接近白、字重适中 -->
  <text x="56" y="112" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="42" font-weight="600" fill="#f6f8fa" letter-spacing="-0.5">moonlitxy</text>

  <!-- 副标题：灰色、中等 -->
  <text x="56" y="146" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#8b949e">Go 学长 · Backend Engineer · 用 Go 造轮子</text>

  <!-- 右侧：简洁的状态指示，不搞大字 -->
  <g transform="translate(720,100)">
    <circle cx="0" cy="0" r="4" fill="#3fb950"/>
    <text x="12" y="4" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#8b949e">Available</text>
  </g>

  <!-- 底部细分隔线 -->
  <rect x="56" y="176" width="768" height="1" fill="#21262d"/>
</svg>
